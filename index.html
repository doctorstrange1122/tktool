<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="秒杀二维码">
    <meta name="theme-color" content="#6a9a7a">
    <link rel="manifest" href="/tktool/manifest.json">
    <title>秒杀商品过肥二维码生成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8edf2 0%, #d3dde6 50%, #c2cfd9 100%);
            min-height: 100vh;
            padding: 16px;
            color: #3a4a5a;
        }
        .wrapper { max-width: 480px; margin: 0 auto; }

        /* 标题 */
        .header { text-align: center; padding: 20px 0 16px; color: #4a5c6e; }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
        .header .subtitle { font-size: 13px; color: #8a9bad; margin-top: 6px; }

        /* 卡片通用 */
        .card {
            background: #fdfdfe;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(120,140,160,0.1);
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 15px; font-weight: 600; color: #6b7f92;
            margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
        }
        .card-title::before { content: ""; width: 4px; height: 16px; background: #8ba0b5; border-radius: 2px; }

        /* 权限提示 — 蓝色系，提示性质 */
        .permission-tip {
            background: #eaf0f6;
            border: 1px solid #c5d2de;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #5a7a96;
            text-align: left;
        }

        /* 输入区 */
        .input-section { margin-bottom: 14px; }
        .input-section label {
            display: block; font-size: 14px; font-weight: 600;
            color: #4a5c6e; margin-bottom: 6px;
        }
        .input-section input {
            width: 100%;
            padding: 12px 14px; font-size: 16px;
            border: 2px solid #dde3ea; border-radius: 10px;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            font-family: inherit;
            background: #fff;
            color: #3a4a5a;
        }
        .input-section input:focus { outline: none; border-color: #8ba0b5; }
        .input-section input::placeholder { color: #b0bcc8; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input { flex: 1; }
        .clear-button {
            padding: 12px 16px; font-size: 14px; font-weight: 600;
            background: #eef2f6; color: #7a8b9c;
            border: none; border-radius: 10px; cursor: pointer;
            white-space: nowrap; flex-shrink: 0;
        }
        .clear-button:active { background: #e0e6ec; }
        .scan-button {
            padding: 12px 16px; font-size: 14px; font-weight: 600;
            background: #6a9a7a; color: #fff;
            border: none; border-radius: 10px; cursor: pointer;
            white-space: nowrap; flex-shrink: 0;
        }
        .scan-button:active { background: #5a8a6a; }

        /* 扫码弹窗 */
        .scan-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .scan-modal.active { display: flex; }
        .scan-close {
            position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.2); border: none; border-radius: 50%;
            color: #fff; font-size: 20px; cursor: pointer; line-height: 40px; text-align: center;
        }
        .scan-close:active { background: rgba(255,255,255,0.4); }
        .scan-viewport {
            width: 280px; height: 280px; border-radius: 16px; overflow: hidden;
            border: 3px solid #6a9a7a; position: relative;
        }
        .scan-viewport video { width: 100%; height: 100%; object-fit: cover; }
        .scan-hint {
            color: #fff; font-size: 14px; margin-top: 16px; text-align: center;
        }

        /* 提示文字 — 醒目颜色 */
        .tip-text { font-size: 13px; color: #d4884a; font-weight: 500; margin-top: 6px; }

        /* 生成按钮组 - 221排列 */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .button-group button {
            padding: 14px 12px; font-size: 15px; font-weight: 600;
            border: none; border-radius: 12px; cursor: pointer;
            background: linear-gradient(135deg, #7a93ac, #6b82a0);
            color: #fff;
            box-shadow: 0 4px 14px rgba(110,130,160,0.25);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        /* 当按钮总数为奇数时，最后一个按钮独占一整行，宽度与上方两按钮对齐 */
        .button-group button:last-child:nth-child(odd) {
            grid-column: 1 / -1;
        }
        .button-group button:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(110,130,160,0.25);
        }

        /* 结果区 */
        #resultArea { margin-top: 0; margin-bottom: 18px; }
        .qr-code-container {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
        }
        .qr-code-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        .qr-code-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 140px;
        }
        #resultArea img { display: inline-block; }
        .result-card { text-align: center; }
        .result-card img {
            border-radius: 12px; box-shadow: 0 4px 16px rgba(120,140,160,0.12);
            margin: 10px 0;
        }
        .long-press-tip {
            display: inline-block;
            background: #eef6ff;
            border: 1px solid #b3d0f0;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: #2c6cb5;
            font-weight: 600;
            margin: 4px 0 12px;
        }
        .result-info {
            font-size: 14px; color: #4a5c6e; margin: 8px 0;
            padding: 10px; background: #f4f7fa; border-radius: 8px;
        }
        .result-info .copy-success {
            color: #6a9a7a; font-size: 12px; font-weight: 600;
            display: inline; margin-left: 8px;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex; flex-direction: column; gap: 10px; align-items: center;
        }
        .action-buttons button {
            width: 100%; min-width: 130px;
            padding: 12px 16px; font-size: 14px; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .action-buttons button:active { transform: scale(0.96); }
        .action-buttons button:nth-child(1) { background: #7a93ac; color: #fff; }
        .action-buttons button:nth-child(3) { background: #6a9a7a; color: #fff; }
        .action-buttons .copy-success {
            color: #6a9a7a; font-size: 12px; line-height: 38px; display: none;
        }

        /* 带文字二维码 */
        .qr-code-with-text {
            display: inline-block; text-align: center;
            background: #fff; padding: 12px; border-radius: 12px;
            box-shadow: 0 4px 16px rgba(120,140,160,0.12); margin: 10px;
        }
        .qr-code-text {
            font-size: 16px; font-weight: 600; margin-bottom: 8px;
            max-width: 180px; word-wrap: break-word; line-height: 1.3;
            color: #4a5c6e;
        }

        /* 使用说明 */
        .usage-tips { font-size: 14px; line-height: 1.7; text-align: left; }
        .usage-tips h3 { margin-bottom: 10px; color: #6b7f92; font-size: 15px; }
        /* 浏览器提示 — 琥珀色，注意性质 */
        .usage-tips .browser-tip {
            background: #fdf6e8; border: 1px solid #e8d8b0; border-radius: 8px;
            padding: 8px 12px; margin-bottom: 10px; font-size: 13px; color: #9a7e3a;
        }
        .usage-tips ol { padding-left: 20px; }
        /* 安卓说明 — 绿灰，正面引导 */
        .usage-tips li:nth-child(1) { color: #5a7a6a; }
        /* 鸿蒙说明 — 蓝灰，补充说明 */
        .usage-tips li:nth-child(2) { color: #6a7a8a; }
        /* 保存说明 — 琥珀色，操作引导 */
        .usage-tips li:nth-child(3) { color: #9a7e3a; }

        /* 页脚 */
        .footer { text-align: center; font-size: 11px; color: #9aa8b6; padding: 16px 0 8px; }
    </style>
</head>
<body>
<div class="wrapper">

            <button onclick="generateQRCodes(50000, 'https://pages-fast.m.taobao.com/wow/z/app/ltao-fe/tjb-ssr/home?x-ssr=true&pha_manifest=default&disableNav=YES&x-preload=true&disableProgress=true&disableRedirect=tr&x-sec=wua&spma=mspd&spmb=qdmsxiadan&prismTrace=70424&deliveryId=70424&sceneId=7506&itemIds=', '5万②')">5万肥料②(1次)</button>
            <button onclick="generateQRCodes(60000, 'https://pages-fast.m.taobao.com/wow/z/app/ltao-fe/tjb-ssr/home?x-ssr=true&pha_manifest=default&disableNav=YES&x-preload=true&disableProgress=true&disableRedirect=tr&x-sec=wua&spma=mspd&spmb=qdmsxiadan&prismTrace=68206&deliveryId=68206&sceneId=7506&itemIds=', '6万')">6万肥料(1次)</button>

                <li><strong>鸿蒙设备：</strong>跳转淘宝不支持自动弹窗，请在淘宝首页搜索框长按粘贴已复制的链接即可打开过肥页面</li>

    <!-- 扫码弹窗 -->
    <div class="scan-modal" id="scanModal">
        <button class="scan-close" onclick="stopScan()">✕</button>
        <div class="scan-viewport" id="scanViewport"></div>
        <div class="scan-hint">将二维码对准框内，自动识别</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/tktool/sw.js');
        }
    </script>
    <script>
        // 全局变量
        let currentQRCodeCanvas = null;
        let currentQRCodeWithTextCanvas = null;

        // 清空输入框功能
        function clearInput() {
            document.getElementById('productLink').value = '';
            document.getElementById('customText').value = '';
        }

        // ====== 扫码功能（APK用原生拍照，浏览器用html5-qrcode浮窗） ======
        const isInApp = typeof NativeBridge !== 'undefined' && NativeBridge.startNativeScan;
        let html5QrCode = null;

        async function startScan() {
            // APK 环境：调用系统相机拍照扫码（静态，不卡顿）
            if (isInApp) {
                window.onScanResult = function(result) {
                    if (result === 'CANCEL') return;
                    if (result === 'ERROR') {
                        alert('扫码解析失败，请重试或手动粘贴淘口令');
                    } else if (result === 'NOT_FOUND') {
                        alert('未识别到二维码，请重新拍照');
                    } else {
                        document.getElementById('productLink').value = result;
                    }
                };

                // APK 接收外部分享的文本（如从淘宝分享直达），只填入不自动生成
                window.setInputAndGenerate = function(text) {
                    document.getElementById('productLink').value = text;
                };
                NativeBridge.startNativeScan();
                return;
            }

            // 浏览器环境：html5-qrcode 浮窗弹窗扫码
            const modal = document.getElementById('scanModal');
            modal.classList.add('active');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode('scanViewport');
            }

            try {
                await html5QrCode.start(
                    { facingMode: 'environment' },
                    {
                        fps: 10,
                        qrbox: { width: 220, height: 220 },
                        aspectRatio: 1.0,
                        disableFlip: false
                    },
                    (decodedText) => {
                        document.getElementById('productLink').value = decodedText;
                        stopScan();
                    },
                    () => {}
                );

                setTimeout(() => tryApplyFocus(), 500);
            } catch (err) {
                console.error('扫码启动失败:', err);
                alert('无法打开相机，请检查相机权限。也可以手动粘贴淘口令。');
                stopScan();
            }
        }

        function tryApplyFocus() {
            try {
                const video = document.querySelector('#scanViewport video');
                if (!video || !video.srcObject) return;
                const track = video.srcObject.getVideoTracks()[0];
                if (!track) return;
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                const modes = ['continuous', 'manual', 'single-shot', 'auto'];
                const mode = modes.find(m => caps.focusMode && caps.focusMode.includes(m));
                if (mode) {
                    track.applyConstraints({ advanced: [{ focusMode: mode }] }).catch(() => {});
                }
            } catch (e) {}
        }

        async function stopScan() {
            document.getElementById('scanModal').classList.remove('active');
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.stop(); } catch (e) {}
            }
        }
        // ====== 扫码功能结束 ======

        // CORS 代理列表（并行竞争，谁先返回用谁）
        const CORS_PROXIES = [
            (url) => `https://proxy.cors.sh/${url}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
            (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
            (url) => `https://crossorigin.me/${url}`,
            (url) => `https://cors-proxy.htmldriven.com/?url=${encodeURIComponent(url)}`,
            (url) => `https://cors.x2u.in/${url}`,
            (url) => `https://whateverorigin.org/get?url=${encodeURIComponent(url)}`,
        ];

        // 从分享文本中提取短链
        function extractShortUrl(text) {
            const m = text.match(/https?:\/\/[^\s，。￥¥₳【】\]\[]+/);
            return m ? m[0] : null;
        }

        // 通过 CORS 代理请求 URL，返回响应文本
        async function fetchWithProxy(targetUrl) {
            // 并行请求所有代理，谁先返回就用谁的
            const promises = CORS_PROXIES.map((proxyFn, i) => {
                const proxyUrl = proxyFn(targetUrl);
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                return fetch(proxyUrl, { signal: controller.signal })
                    .then(resp => {
                        clearTimeout(timeoutId);
                        if (resp.ok) return resp.text();
                        throw new Error('bad status');
                    })
                    .then(text => {
                        if (text && text.length > 50) return text;
                        throw new Error('too short');
                    })
                    .catch(e => { throw e; });
            });
            try {
                return await Promise.any(promises);
            } catch (e) {
                return null;
            }
        }

        // 从 URL 中提取商品ID（零网络，毫秒级）
        function extractItemIdFromUrl(url) {
            // 按最常见的格式优先匹配（id= 至少7位数字避免匹配短值如 YES）
            const m = url.match(/[?&]id=(\d{7,})/)          // id= 后至少7位数字
                || url.match(/topIds=(\d+)/)                 // 淘宝分享页的 topIds 参数
                || url.match(/itemIds=(\d+)/)
                || url.match(/\/i(\d+)\.htm/)
                || url.match(/\/(\d+)\.html?/);
            return m ? m[1] : null;
        }

        // 通过短链直接跟随重定向获取最终URL（快路径，不走代理）
        async function resolveShortUrl(shortUrl) {
            // 三种方法并行，谁先成功返回用谁
            const results = await Promise.allSettled([
                // 方法1：标准 fetch + redirect follow + body 提取
                (async () => {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const resp = await fetch(shortUrl, {
                        redirect: 'follow',
                        signal: controller.signal,
                    });
                    clearTimeout(timeoutId);
                    if (resp.url && resp.url !== shortUrl) return resp.url;
                    // e.tb.cn 返回 200 HTML，直接从 body 提取
                    const body = await resp.text();
                    if (body && body.length > 200) {
                        const urlMatch = body.match(/var\s+url\s*=\s*'([^']+)'/);
                        if (urlMatch) return urlMatch[1];
                        const topMatch = body.match(/topIds=(\d+)/);
                        if (topMatch) return 'https://item.taobao.com/item.htm?id=' + topMatch[1];
                    }
                    throw new Error('no redirect or body match');
                })(),
                // 方法2：no-cors 模式
                (async () => {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const resp = await fetch(shortUrl, {
                        mode: 'no-cors',
                        redirect: 'follow',
                        signal: controller.signal,
                    });
                    clearTimeout(timeoutId);
                    if (resp.url && resp.url !== shortUrl) return resp.url;
                    throw new Error('no-cors no redirect');
                })(),
                // 方法3：XMLHttpRequest
                new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.timeout = 3000;
                    xhr.onreadystatechange = function() {
                        if (xhr.readyState === 4) {
                            if (xhr.responseURL && xhr.responseURL !== shortUrl) {
                                resolve(xhr.responseURL);
                            } else {
                                reject(new Error('xhr no redirect'));
                            }
                        }
                    };
                    xhr.onerror = () => reject(new Error('xhr error'));
                    xhr.ontimeout = () => reject(new Error('xhr timeout'));
                    xhr.open('HEAD', shortUrl, true);
                    xhr.send();
                }),
            ]);

            for (const r of results) {
                if (r.status === 'fulfilled' && r.value) return r.value;
            }
            return null;
        }

        // 通过淘口令/分享文本解析获取商品ID（异步，需请求网络）
        async function parseItemIdFromShareText(text) {
            // 0. 极速路径：输入本身包含商品链接，直接本地提取（零网络）
            const directId = extractItemIdFromUrl(text);
            if (directId) return directId;

            // 1. 提取短链
            let shortUrl = extractShortUrl(text);
            if (!shortUrl) {
                const token = text.replace(/[^\w]/g, '');
                if (!token) return null;
                shortUrl = `https://m.tb.cn/h.${token}`;
            }
            console.log('解析短链:', shortUrl);

            // 2. 快路径+慢路径并行：同时发起重定向跟踪和代理请求，取最快结果
            const results = await Promise.allSettled([
                // 快路径：直接跟随重定向
                (async () => {
                    const resolvedUrl = await resolveShortUrl(shortUrl);
                    console.log('重定向结果:', resolvedUrl);
                    if (resolvedUrl) {
                        return extractItemIdFromUrl(resolvedUrl);
                    }
                    return null;
                })(),
                // 慢路径：CORS 代理获取完整 HTML
                (async () => {
                    const body = await fetchWithProxy(shortUrl);
                    console.log('代理结果长度:', body ? body.length : 0);
                    if (!body) return null;
                    // 提取 var url = '...'
                    const urlMatch = body.match(/var\s+url\s*=\s*'([^']+)'/);
                    if (urlMatch) {
                        const id = extractItemIdFromUrl(urlMatch[1]);
                        if (id) return id;
                    }
                    // 兜底：从 HTML 直接匹配（含 topIds）
                    const m = body.match(/topIds=(\d+)/) || body.match(/itemIds=(\d+)/) || body.match(/[?&]id=(\d{7,})/);
                    return m ? m[1] : null;
                })(),
            ]);

            // 取最先成功的有效结果
            for (const r of results) {
                if (r.status === 'fulfilled' && r.value) return r.value;
            }
            console.error('所有解析路径均失败');
            return null;
        }

        // 从商品链接中提取商品ID的函数（保留原逻辑，作为兜底）
        function extractProductId(productLink) {
            let productId = '';

            // 方法1：匹配 itemIds= 参数
            const itemIdsMatch = productLink.match(/itemIds=(\d+)/);
            if (itemIdsMatch) {
                productId = itemIdsMatch[1];
                return productId;
            }
            // 方法2：匹配 id= 参数
            const idMatch = productLink.match(/id=(\d+)/);
            if (idMatch) {
                productId = idMatch[1];
                return productId;
            }

            // 方法3：匹配 /i数字.htm 格式
            const iMatch = productLink.match(/\/i(\d+)\.htm/);
            if (iMatch) {
                productId = iMatch[1];
                return productId;
            }
            // 如果以上方法都没有匹配到，尝试从URL中提取数字ID
            const numberMatch = productLink.match(/\/(\d+)\.html?/);
            if (numberMatch) {
                productId = numberMatch[1];
                return productId;
            }

            return null;
        }

        // 复制文本到剪贴板（兼容iOS Safari + Android WebView）
        function copyToClipboard(text) {
            // APK 环境：使用原生剪贴板（不受 file:// 协议限制）
            if (isInApp && NativeBridge.copyToClipboard) {
                NativeBridge.copyToClipboard(text);
                return;
            }

            // 浏览器环境：优先 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {
                    _copyFallback(text);
                });
            } else {
                _copyFallback(text);
            }
        }

        // iOS Safari 兼容的复制方案
        function _copyFallback(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.width = '1px';
            textarea.style.height = '1px';
            textarea.style.opacity = '0';
            textarea.setAttribute('readonly', '');
            document.body.appendChild(textarea);

            // iOS 需要创建 Range 选区
            const range = document.createRange();
            range.selectNodeContents(textarea);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            textarea.setSelectionRange(0, text.length);

            try {
                document.execCommand('copy');
            } catch (e) {
                console.error('复制失败:', e);
            }

            selection.removeAllRanges();
            document.body.removeChild(textarea);
        }

        // 下载二维码图片函数（修复版）
        function downloadQRCode() {
            if (!currentQRCodeCanvas) {
                alert('请先生成二维码');
                return;
            }

            try {
                const link = document.createElement('a');
                link.href = currentQRCodeCanvas.toDataURL('image/png');
                link.download = 'qrcode.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                alert('图片已下载，请在手机「文件管理 → Download」文件夹中查看。若图库未显示，请将图片移动到 DCIM 文件夹。');
            } catch (error) {
                console.error('下载失败:', error);
                alert('下载失败，请长按二维码图片选择「保存到相册」');

        }

        function downloadQRCodeWithText() {

                alert('请先生成带文字的二维码');

        // 跳转到淘宝APP（不兜底打开网页版）
        function openTaobaoApp(url) {
            const taobaoScheme = `taobao://${url.replace('https://', '')}`;
            window.location.href = taobaoScheme;
        }

        // 创建带文字的二维码图片（紧凑布局，减少文字区域上下空白）
        function createQRCodeWithText(qrCodeDataURL, customText) {
            return new Promise((resolve) => {
                const qrCodeImg = new Image();
                qrCodeImg.src = qrCodeDataURL;

                qrCodeImg.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const qrSize = 180;
                    const padding = 12;
                    const fontSize = 18;
                    const lineHeight = fontSize + 4;
                    const maxCharsPerLine = 12;

                    // 文字换行处理
                    const lines = [];
                    let currentLine = '';
                    for (let i = 0; i < customText.length; i++) {
                        currentLine += customText[i];
                        if (currentLine.length >= maxCharsPerLine || i === customText.length - 1) {
                            lines.push(currentLine);
                            currentLine = '';
                        }
                    }

                    const textAreaHeight = lines.length * lineHeight + padding;
                    canvas.width = qrSize + padding * 2;
                    canvas.height = qrSize + textAreaHeight + padding;

                    // 绘制白色背景
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 绘制文字
                    ctx.fillStyle = '#333';
                    ctx.font = `bold ${fontSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    lines.forEach((line, index) => {
                        ctx.fillText(line, canvas.width / 2, padding + lineHeight * (index + 0.5));
                    });

                    // 绘制二维码
                    ctx.drawImage(qrCodeImg, padding, textAreaHeight, qrSize, qrSize);
                    resolve(canvas);
                };

                qrCodeImg.onerror = function() {
                    console.error('二维码图片加载失败');
                    resolve(document.createElement('canvas')); // 返回空canvas避免错误
                };
            });
        }

        // 生成普通二维码图片（无文字）
        function createQRCodeOnly(qrCodeDataURL) {
            return new Promise((resolve) => {
                const qrCodeImg = new Image();
                qrCodeImg.src = qrCodeDataURL;

                qrCodeImg.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // 设置画布尺寸与二维码相同
                    canvas.width = 150;
                    canvas.height = 150;

                    // 绘制白色背景
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    // 绘制二维码
                    ctx.drawImage(qrCodeImg, 0, 0, 150, 150);

                    resolve(canvas);
                };

                qrCodeImg.onerror = function() {
                    console.error('二维码图片加载失败');
                    resolve(document.createElement('canvas'));
                };
            });
        }

        async function generateQRCodes(quantity, fixedString, autoLabel) {
            // 获取用户输入的淘口令/分享文本和自定义文字
            const productLink = document.getElementById('productLink').value.trim();
            const userCustomText = document.getElementById('customText').value.trim();

            // 检查输入是否为空
            if (!productLink) {
                alert('请先输入淘口令或分享文本');
                return;
            }

            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<p>正在解析淘口令并生成，请稍候...</p>';

            // 先尝试通过淘口令解析获取商品ID
            let productId = null;
            try {
                productId = await parseItemIdFromShareText(productLink);
            } catch (e) {
                console.warn('淘口令解析异常:', e.message);
            }

            // 如果淘口令解析失败，回退到原有的链接提取逻辑
            if (!productId) {
                productId = extractProductId(productLink);
            }

            if (!productId) {
                resultArea.innerHTML = '<p style="color: red;">解析失败：无法获取商品ID</p><p style="font-size:12px;color:#999;">可能原因：① 网络不稳定，代理请求失败；② 输入的不是有效的淘口令或商品链接；③ 淘宝短链已失效。请检查网络后重试。</p>';
                return;
            }

            try {
                // 将固定字符串与提取的商品ID连接起来
                const fullContent = fixedString + productId;
                // 使用组合后的完整字符串生成一个二维码
                const qrCodeDataURL = await QRCode.toDataURL(fullContent, {
                    width: 150,
                    height: 150,
                    colorDark: "#000000",
                    colorLight: "#FFFFFF"
                });

                // 自动复制到剪贴板
                copyToClipboard(fullContent);

                // 拼接二维码上方文字：自定义文字 + 两个空格 + 自动标签
                let displayText = autoLabel || '';
                if (userCustomText) {
                    displayText = userCustomText + '  ' + (autoLabel || '');
                }

                // 创建一个用于显示结果的容器
                const container = document.createElement('div');
                container.className = 'qr-code-container';

                // 创建复制成功提示
                const contentInfo = document.createElement('div');
                contentInfo.style.margin = '10px 0';
                contentInfo.innerHTML = '<span class="copy-success">✓ 生成二维码内容已复制到剪贴板</span>';

                // 长按保存提示
                const saveTip = document.createElement('div');
                saveTip.className = 'long-press-tip';
                saveTip.textContent = '👆 长按二维码图片可保存至图库';

                // 创建操作按钮区域
                const actionButtons = document.createElement('div');
                actionButtons.className = 'action-buttons';

                // 始终创建带文字的二维码（至少包含自动标签）
                currentQRCodeWithTextCanvas = await createQRCodeWithText(qrCodeDataURL, displayText);

                const mergedImg = document.createElement('img');
                mergedImg.src = currentQRCodeWithTextCanvas.toDataURL('image/png');
                mergedImg.alt = '带文字的二维码';
                mergedImg.style.maxWidth = '180px';
                mergedImg.style.borderRadius = '8px';
                mergedImg.style.cursor = 'pointer';
                mergedImg.style.webkitTouchCallout = 'none';

                // 长按保存：APK 用原生保存到图库，浏览器弹出系统菜单（含"保存图片"选项）
                mergedImg.addEventListener('contextmenu', function(e) {
                    if (isInApp) {
                        e.preventDefault();
                    }
                });
                let longPressTimer;
                mergedImg.addEventListener('touchstart', function(e) {
                    longPressTimer = setTimeout(function() {
                        if (isInApp && NativeBridge.saveImage) {
                            if (confirm('是否保存二维码图片到图库？')) {
                                NativeBridge.saveImage(currentQRCodeWithTextCanvas.toDataURL('image/png'));
                            }
                        }
                    }, 600);
                });
                mergedImg.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
                mergedImg.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });

                // 左侧：二维码
                const qrLeft = document.createElement('div');
                qrLeft.className = 'qr-code-left';
                qrLeft.appendChild(mergedImg);

                // 右侧：操作区
                const qrRight = document.createElement('div');
                qrRight.className = 'qr-code-right';

                actionButtons.innerHTML = `
                    <button onclick="copyToClipboard('${fullContent}'); this.nextElementSibling.style.display='inline'; setTimeout(() => this.nextElementSibling.style.display='none', 2000)">复制链接</button>
                    <span class="copy-success">✓ 已复制</span>
                    <button onclick="openTaobaoApp('${fullContent}')">一键跳转淘宝APP</button>
                `;

                qrRight.appendChild(contentInfo);
                qrRight.appendChild(saveTip);
                qrRight.appendChild(actionButtons);

                container.appendChild(qrLeft);
                container.appendChild(qrRight);

                // 更新结果区域
                resultArea.innerHTML = '';
                resultArea.appendChild(container);
            } catch (error) {
                console.error('生成失败:', error);
                resultArea.innerHTML = '<p style="color: red;">生成过程中出现错误，请检查控制台。</p>';
            }
        }
    </script>
