<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载过肥工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8edf2 0%, #d3dde6 50%, #c2cfd9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #3a4a5a;
        }
        .container {
            text-align: center;
            background: #fdfdfe;
            border-radius: 20px;
            padding: 40px 48px;
            box-shadow: 0 8px 32px rgba(120,140,160,0.15);
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #4a5c6e;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #qrcode img,
        #qrcode canvas {
            border-radius: 12px;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #8a9bad;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">浏览器扫码下载过肥工具</div>
        <div id="qrcode"></div>
        <div class="footer">扫码后点击下载安装</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.6/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "https://github.com/doctorstrange1122/tktool/raw/main/guofei_tool.apk",
            width: 256,
            height: 256,
            colorDark: "#3a4a5a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
