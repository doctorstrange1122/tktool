<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伪短链测试</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
}
h2 { margin: 0 0 20px 0; color: #333; font-size: 18px; }
#qrcode { margin: 20px 0; }
#qrcode canvas { border-radius: 8px; }
.short-url {
    background: #f0f0f0;
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 14px;
    color: #333;
    word-break: break-all;
    margin: 15px 0;
}
.info {
    font-size: 13px;
    color: #666;
    margin-top: 15px;
    line-height: 1.6;
}
</style>
</head>
<body>
<div class="card">
    <h2>伪短链测试二维码</h2>
    <div id="qrcode"></div>
    <div class="short-url" id="shortUrl">https://tktool.pages.dev/s/67bt9g</div>
    <div class="info">
        短链有效期：30天<br>
        请用手机相机或淘宝扫码测试
    </div>
</div>
<script>
const shortUrl = 'https://tktool.pages.dev/s/67bt9g';
QRCode.toCanvas(document.getElementById('qrcode'), shortUrl, {
    width: 256,
    margin: 2,
    color: { dark: '#000000', light: '#ffffff' }
});
</script>
</body>
</html>
