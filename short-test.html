<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伪短链二维码测试</title>
<style>
body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
}
.card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
}
h2 { margin: 0 0 24px 0; color: #333; font-size: 20px; }
.qr-wrap {
    background: #fff;
    padding: 20px;
    border: 2px solid #eee;
    border-radius: 12px;
    display: inline-block;
    margin: 10px 0 20px 0;
}
.qr-wrap img {
    width: 280px;
    height: 280px;
    display: block;
}
.short-url {
    background: #f0f0f0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    color: #333;
    word-break: break-all;
    margin: 15px 0;
    font-family: monospace;
}
.info {
    font-size: 13px;
    color: #666;
    margin-top: 15px;
    line-height: 1.8;
    text-align: left;
    background: #f9f9f9;
    padding: 12px 15px;
    border-radius: 8px;
}
</style>
</head>
<body>
<div class="card">
    <h2>伪短链测试二维码</h2>
    <div class="qr-wrap">
        <img src="/short-qr.png" alt="短链二维码">
    </div>
    <div class="short-url">https://tktool.pages.dev/s/67bt9g</div>
    <div class="info">
        <strong>测试方式：</strong><br>
        1. 手机相机扫码 → 看能否跳转淘宝<br>
        2. 淘宝APP扫码 → 看能否识别打开<br>
        3. 复制链接微信打开 → 看能否跳转
    </div>
</div>
</body>
</html>
